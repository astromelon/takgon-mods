name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    name: validate · test (windows)
    # 테스트가 프로젝트 루트를 Windows 절대 경로(C:/proj)로 가정하므로 Windows에서만 돌린다.
    # Linux에서는 경로가 상대 경로로 해석돼 fs mock·Image 경로 검사가 어긋난다(플러그인 동작 문제는 아님).
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # 로그인 없이 동작한다(validate·test는 모델을 호출하지 않는다). 자동 업데이트와 부가 트래픽은 끈다.
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 테스트를 검증한 Claude Code 버전으로 고정한다. 올릴 때는 로컬에서 validate·test를 먼저 통과시킨다.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296

      - name: Version
        run: claude --version

      - name: Validate plugin
        run: claude plugin validate .

      - name: Test plugin
        run: claude plugin test .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install e2e dependencies
        run: pip install -r tools/e2e/requirements.txt

      # 하네스 단위 테스트(가상 터미널 재구성 및 비표준 CSI 필터)를 검증한다.
      - name: Test e2e harness
        run: python -m unittest discover -s tools/e2e -p "test_*.py"

      # 엔진 제약 감시용 e2e probe 2개(catch, clear state)를 실행한다(모델 호출 없음).
      # probe_classic(제약 1번)은 CI 러너에서 classic.* 훅이 bypass되지 않아 실패하므로 로컬에서만 돌린다.
      - name: Run e2e probes
        run: python tools/e2e/run.py probe_catch probe_clear_state

      # 임시 진단: probe_classic이 CI에서 실패하는 원인(cc-plugin-sec-default가 놓이지 않는 것으로 추정)을
      # debug 로그로 확인한다. 실패해도 CI 결과에는 영향을 주지 않는다. 원인이 확정되면 이 두 단계를 정리한다.
      - name: Diagnose probe_classic (non-blocking)
        continue-on-error: true
        run: python tools/e2e/run.py probe_classic

      - name: Show security plugin seating
        if: always()
        continue-on-error: true
        run: Get-ChildItem tools/e2e/logs -Filter "*.debug.log" -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.Name)"; Select-String -Path $_.FullName -Pattern "seated|sec-default|classic-probe" | ForEach-Object { $_.Line } }

      - name: Upload e2e debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug-logs
          path: tools/e2e/logs/
          if-no-files-found: warn
          retention-days: 14
