name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    name: validate · test (windows)
    # 테스트가 프로젝트 루트를 Windows 절대 경로(C:/proj)로 가정하므로 Windows에서만 돌린다.
    # Linux에서는 경로가 상대 경로로 해석돼 fs mock·Image 경로 검사가 어긋난다(플러그인 동작 문제는 아님).
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # 로그인 없이 동작한다(validate·test는 모델을 호출하지 않는다). 자동 업데이트와 부가 트래픽은 끈다.
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          # 태그·버전 일치 검사가 태그와 그 커밋의 파일을 읽으므로 전체 이력이 필요하다.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # plugin.json 버전과 CHANGELOG 최상단 버전 절이 같은지 검사한다(배포 절차 누락 방지).
      - name: Check release version
        run: node tools/release.mjs --check

      # 태그 vX.Y.Z마다 그 커밋의 plugin.json·CHANGELOG 버전이 X.Y.Z인지, 현재 버전의 태그가 있는지 검사한다(태그 누락 방지).
      - name: Check release tags
        run: node tools/release.mjs --check-tags

      # 테스트를 검증한 Claude Code 버전으로 고정한다. 올릴 때는 로컬에서 validate·test를 먼저 통과시킨다.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296

      - name: Version
        run: claude --version

      - name: Validate plugin
        run: claude plugin validate .

      - name: Test plugin
        run: claude plugin test .

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install e2e dependencies
        run: pip install -r tools/e2e/requirements.txt

      # 하네스 단위 테스트(가상 터미널 재구성 및 비표준 CSI 필터)를 검증한다.
      - name: Test e2e harness
        run: python -m unittest discover -s tools/e2e -p "test_*.py"

      # 엔진 제약 감시용 e2e probe 2개(catch, clear state)를 실행한다(모델 호출 없음).
      # probe_classic(제약 1번)은 CI 러너에 cc-plugin-sec-default가 놓이지 않아(로그인 없음, docs/engine-constraints.md 1번)
      # classic.* 훅이 bypass되지 않으므로 로컬에서만 돌린다.
      - name: Run e2e probes
        run: python tools/e2e/run.py probe_catch probe_clear_state
